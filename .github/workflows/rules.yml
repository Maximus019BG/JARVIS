name: Rules

# Mechanical checks for the AGENTS.md rules. See tools/check-rules.ts.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Rules (env, docs, generated files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rule checks (env, canon paths, no skipped tests)
        run: bun tools/check-rules.ts env canon-paths no-skip

      - name: Rule check tests
        run: bun test ./tools

      # Rule 10. Escape hatch: a `Docs-Skip: <reason>` line in any commit message of the PR.
      - name: Docs follow code
        if: github.event_name == 'pull_request'
        run: bun tools/check-rules.ts docs-touched --range "origin/${{ github.base_ref }}..HEAD"

      # Rule 5: the config schema is generated, never hand-edited.
      - name: tui/jarvis.schema.json is fresh
        working-directory: tui
        run: bun run schema && git diff --exit-code jarvis.schema.json

      # Rule 3: a schema change ships with its migration.
      - name: Drizzle migrations match the schema
        env:
          SKIP_ENV_VALIDATION: '1'
        run: pnpm --filter web db:generate && git diff --exit-code web/drizzle && test -z "$(git status --porcelain web/drizzle)"

  pr_title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Squash merges use the PR title as the commit subject, so it goes through the same hook.
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title" && sh .githooks/commit-msg "$RUNNER_TEMP/title"
