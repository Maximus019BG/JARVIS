name: Web CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web_check:
    name: Web (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm first: setup-node's pnpm cache needs the binary. Version comes from `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm check` minus `pnpm rules`, which runs in rules.yml (it needs Bun).
      - name: Check (lint + typecheck)
        run: pnpm lint && pnpm typecheck

      - name: Write step summary
        if: ${{ always() }}
        run: |
          {
            echo "## Web check"
            echo "- lint + typecheck: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  web_test_build:
    name: Web (tests + build)
    needs: [web_check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm first: setup-node's pnpm cache needs the binary. Version comes from `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # tui tests run in tui-ci; both workflows run on every PR.
      - name: Unit tests
        run: pnpm --filter web test

      - name: Build
        run: pnpm run build

      - name: Write step summary
        if: ${{ always() }}
        run: |
          {
            echo "## Web test + build"
            echo "- tests + build: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
