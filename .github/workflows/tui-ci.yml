name: TUI CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui:
    name: TUI (tests + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Write step summary
        if: ${{ always() }}
        run: |
          {
            echo "## TUI"
            echo "- tests + typecheck: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
