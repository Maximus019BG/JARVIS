apiVersion: apps/v1
kind: ProductionDeployment
metadata:
  name: db-server
  namespace: dev
  labels:
    app: db-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-server
  template:
    metadata:
      labels:
        app: db-server
    spec:    
  containers:
        - name: db-server
          image: postgres:15-alpine
          envFrom:
            - secretRef:
                name: db-env
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data-pvc