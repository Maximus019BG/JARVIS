apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-proxy
  namespace: dev
data:
  default.conf: |
    server {
      listen 80;
      client_max_body_size 10m;

      location / {
        proxy_pass http://api-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, don't append: web/src/proxy.ts rate-limits on the FIRST entry,
        # so a client-supplied X-Forwarded-For must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Streaming responses (gateway / event streams) and websocket upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
      }
    }

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
  namespace: dev
  labels:
    app: reverse-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
      annotations:
        # Bump to roll the pods after editing the ConfigMap.
        config-version: "1"
    spec:
      containers:
        - name: reverse-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: reverse-proxy
---
# The public entry point. LoadBalancer works on Docker Desktop and cloud clusters;
# on kind/minikube use `kubectl port-forward -n dev svc/reverse-proxy 8080:80`.
apiVersion: v1
kind: Service
metadata:
  name: reverse-proxy
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: reverse-proxy
  ports:
    - port: 80
      targetPort: 80
