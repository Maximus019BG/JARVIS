apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api.yaml
  - db.yaml
  - proxy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: jarvis
# Hashed name: editing nginx.conf rolls the proxy pods automatically.
configMapGenerator:
  - name: reverse-proxy
    files:
      - default.conf.template=nginx.conf
