apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
  labels:
    app: reverse-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
        - name: reverse-proxy
          image: nginx:1.27-alpine
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 80
            - containerPort: 443
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates
              readOnly: true
            # nginx reads it only at start: after k8s/tls.sh replaces it, the script restarts the pods.
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: reverse-proxy
        # Must exist before the pods can start: k8s/tls.sh <namespace> [domain]
        - name: tls
          secret:
            secretName: reverse-proxy-tls
---
# The public entry point. LoadBalancer works on Docker Desktop and cloud clusters;
# on kind/minikube use `kubectl port-forward -n <ns> svc/reverse-proxy 8443:443` → https://localhost:8443.
apiVersion: v1
kind: Service
metadata:
  name: reverse-proxy
spec:
  type: LoadBalancer
  # Keep the real client IP (no SNAT to a node IP) — nginx rate-limits on $remote_addr.
  externalTrafficPolicy: Local
  selector:
    app: reverse-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
