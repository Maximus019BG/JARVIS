# Rendered at container start by the nginx image's envsubst step (/etc/nginx/templates):
# only real env vars are replaced, so ${POD_NAMESPACE} is filled and nginx's own $vars survive.

# Cluster DNS. `valid=10s` re-resolves the pod list so scale-ups/restarts are picked up.
resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

# No nginx version in error pages / the Server header.
server_tokens off;

# Rate limiting, keyed on the client IP (the Service keeps it via externalTrafficPolicy: Local).
# strict: login/pairing/webhook — anything reachable without a session. 15 per 30s, same as the old proxy.ts.
# general: everything else under /api — a flood guard only; TUI + web polling sit far below it.
# ponytail: zones are per nginx replica, so with 2 proxies the effective limit is 2x. LB/ingress limiter if that matters.
limit_req_zone $binary_remote_addr zone=strict:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_status 429;

# Open connections per client IP. Event streams hold one each, so this is set well above
# what a household (web tabs + TUI + Pi behind one NAT) keeps open — it only stops floods.
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_status 429;

upstream api {
  # Headless Service → DNS returns one A record per READY api pod; nginx balances across them.
  zone api 64k;
  server api-server.${POD_NAMESPACE}.svc.cluster.local:3000 resolve max_fails=3 fail_timeout=10s;
  # Fewest open connections wins: event streams hold connections for minutes,
  # so round-robin would pile them onto one pod.
  least_conn;
  # Reuse connections to the pods instead of a TCP handshake per request.
  keepalive 32;
}

# Plain HTTP only redirects. 308, not 301: a TUI/Pi still configured with http:// gets its
# POST replayed over TLS, where a 301 lets clients turn it into a body-less GET.
server {
  listen 80 default_server;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl default_server;
  http2 on;

  # The reverse-proxy-tls Secret (k8s/tls.sh), mounted by proxy.yaml.
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  # Mozilla "intermediate": TLS 1.2+, nginx's default cipher list, cached sessions instead of
  # tickets (tickets reuse one key for the pod's lifetime and weaken forward secrecy).
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 10m;
  # Slowloris: drop clients that trickle headers/body. Per read, not a total — big uploads are fine.
  client_header_timeout 10s;
  client_body_timeout 15s;
  limit_conn perip 100;

  # Inherited by every location that sets no add_header of its own (@ratelimited does — fine).
  # No includeSubDomains/preload: those are hard to undo and cover hosts this file doesn't serve.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Shared by every location below (inherited because no location sets its own).
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Overwrite, don't append: a client-supplied X-Forwarded-For must not survive.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header User-Agent $http_user_agent;
  # Streaming responses (gateway / event streams) and websocket upgrades.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_read_timeout 300s;
  # A pod that refuses/drops the connection → retry the next one (idempotent requests only).
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  # JSON, not nginx's HTML page: `jarvis pair` parses the body and backs off on "slow_down" (RFC 8628).
  error_page 429 = @ratelimited;

  # Pages and assets: unmetered — one navigation fans out into many prefetch/asset requests.
  location / {
    proxy_pass http://api;
  }

  location /api/ {
    limit_req zone=general burst=50 nodelay;
    proxy_pass http://api;
  }

  # Regex beats the /api/ prefix above.
  location ~ ^/api/(auth/|device/(code|token)$|automations/webhook/) {
    limit_req zone=strict burst=15 nodelay;
    proxy_pass http://api;
  }

  location @ratelimited {
    default_type application/json;
    add_header Retry-After 30 always;
    return 429 '{"error":"slow_down","message":"Rate limit exceeded"}';
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  # Empty, not `close`: lets plain requests reuse the keepalive pool.
  ''      '';
}
