# Rendered at container start by the nginx image's envsubst step (/etc/nginx/templates):
# only real env vars are replaced, so ${POD_NAMESPACE} is filled and nginx's own $vars survive.

# Cluster DNS. `valid=10s` re-resolves the pod list so scale-ups/restarts are picked up.
resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

# Rate limiting, keyed on the client IP (the Service keeps it via externalTrafficPolicy: Local).
# strict: login/pairing/webhook — anything reachable without a session. 15 per 30s, same as the old proxy.ts.
# general: everything else under /api — a flood guard only; TUI + web polling sit far below it.
# ponytail: zones are per nginx replica, so with 2 proxies the effective limit is 2x. LB/ingress limiter if that matters.
limit_req_zone $binary_remote_addr zone=strict:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_status 429;

upstream api {
  # Headless Service → DNS returns one A record per READY api pod; nginx balances across them.
  zone api 64k;
  server api-server.${POD_NAMESPACE}.svc.cluster.local:3000 resolve max_fails=3 fail_timeout=10s;
  # Fewest open connections wins: event streams hold connections for minutes,
  # so round-robin would pile them onto one pod.
  least_conn;
  # Reuse connections to the pods instead of a TCP handshake per request.
  keepalive 32;
}

server {
  listen 80;
  client_max_body_size 10m;

  # Shared by every location below (inherited because no location sets its own).
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Overwrite, don't append: a client-supplied X-Forwarded-For must not survive.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header User-Agent $http_user_agent;
  # Streaming responses (gateway / event streams) and websocket upgrades.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_read_timeout 300s;
  # A pod that refuses/drops the connection → retry the next one (idempotent requests only).
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  # JSON, not nginx's HTML page: `jarvis pair` parses the body and backs off on "slow_down" (RFC 8628).
  error_page 429 = @ratelimited;

  # Pages and assets: unmetered — one navigation fans out into many prefetch/asset requests.
  location / {
    proxy_pass http://api;
  }

  location /api/ {
    limit_req zone=general burst=50 nodelay;
    proxy_pass http://api;
  }

  # Regex beats the /api/ prefix above.
  location ~ ^/api/(auth/|device/(code|token)$|automations/webhook/) {
    limit_req zone=strict burst=15 nodelay;
    proxy_pass http://api;
  }

  location @ratelimited {
    default_type application/json;
    add_header Retry-After 30 always;
    return 429 '{"error":"slow_down","message":"Rate limit exceeded"}';
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  # Empty, not `close`: lets plain requests reuse the keepalive pool.
  ''      '';
}
