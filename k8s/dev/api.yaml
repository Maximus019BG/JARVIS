apiVersion: apps/v1
kind: Production
metadata:
  name: api-server
  namespace: dev
  labels:
    app: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels: 
        app: api-server
    spec:
      containers:
        - name: api-server
          # Built from the repo root: docker build -f web/Dockerfile -t jarvis-web:dev .
          image: jarvis-web:dev
          # Runtime vars from web/src/env.js:
          #   kubectl create secret generic web-env -n dev --from-env-file=web/.env
          envFrom:
            - secretRef:
                name: web-env

          ports: 
            - containerPort: 3000
---
# Internal only — traffic comes in through reverse-proxy (deployment.yaml).
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: dev
spec:
  selector:
    app: api-server
  ports:
    - port: 3000
      targetPort: 3000
